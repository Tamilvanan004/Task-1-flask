<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Details</title>
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
</head>

<body>
    <a href="{{ url_for('home') }}" class="a1">
        Add New Student
    </a>
    <h1>Student Details</h1>

    <div class="div1">
        <table border="1">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Register Number</th>
            <th>Department</th>
            <th>Email</th>
        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student.id }}</td>

            <td>{{ student.name }}</td>

            <td>{{ student.register_number }}</td>

            <td>{{ student.department }}</td>

            <td>{{ student.email }}</td>

        </tr>

        {% endfor %}

    </table>
    </div>

    <br>

    

</body>

</html>
